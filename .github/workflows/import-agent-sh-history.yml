name: Clean temporary contribution transport branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete temporary head branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/Yo-DDV/codex-desktop-linux.git"
          git push origin --delete automation/import-agent-sh-history
