name: Validate standalone contribution transport

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Test whether the repository token can create the required fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$({ curl --silent --show-error --output "$RUNNER_TEMP/fork-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/agent-sh/computer-use-linux/forks; } || true)"
          cat "$RUNNER_TEMP/fork-response.json"
          test "$status" = 202
