name: Apply issue 1185 fix

on:
  pull_request:
    branches:
      - validation/issue-1185-base

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout contribution branch
        uses: actions/checkout@v7
        with:
          ref: fix/x11-avatar-shape-bleed
          fetch-depth: 0

      - name: Apply focused source patch
        run: |
          set -euo pipefail
          git apply --check .github/issue-1185.patch
          git apply .github/issue-1185.patch
          rm -f .github/issue-1185.patch
          rm -f .github/workflows/apply-issue-1185.yml

      - name: Validate syntax and patch hygiene
        run: |
          set -euo pipefail
          node --check scripts/patches/impl/avatar-overlay.js
          node --check scripts/patch-linux-window-ui.test.js
          git diff --check

      - name: Run avatar and patcher regression suite
        env:
          NODE_TEST_TIMEOUT_SECONDS: "600"
        run: |
          set -euo pipefail
          node --test scripts/patch-linux-window-ui.test.js
          bash scripts/ci/run-node-checks.sh

      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name 'Yo-DDV'
          git config user.email '116607353+Yo-DDV@users.noreply.github.com'
          git add scripts/patches/impl/avatar-overlay.js scripts/patch-linux-window-ui.test.js
          git add -u .github
          git diff --cached --check
          git commit -m 'fix(avatar): preserve X11 voice orb render edge'
          git push origin HEAD:fix/x11-avatar-shape-bleed
